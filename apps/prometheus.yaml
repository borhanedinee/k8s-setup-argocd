# ArgoCD Application — Prometheus
# Apply this manifest to your ArgoCD namespace to register Prometheus
# as a synced application.
#
# kubectl apply -f apps/prometheus.yaml -n argocd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring-stack
  # Cascade delete — removing this Application will also remove all K8s resources it created
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # !! Update repoURL to your actual Git repository URL !!
    repoURL: https://github.com/YOUR_ORG/k8s-config-argocd.git
    targetRevision: HEAD
    path: charts/prometheus
    helm:
      releaseName: prometheus
      # Override any values.yaml value here
      values: |
        namespace: monitoring
        retention: 15d
        storage:
          persistent: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true       # Remove resources no longer in Git
      selfHeal: true    # Revert manual changes to match Git state
    syncOptions:
      - CreateNamespace=true          # Create the namespace if it doesn't exist
      - ServerSideApply=true          # Use server-side apply to avoid annotation conflicts
      - ApplyOutOfSyncOnly=true       # Only apply resources that are out of sync
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
