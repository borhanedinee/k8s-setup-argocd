{{- /*
  secret.yaml — Grafana admin credentials.
  Values are base64-encoded as required by Kubernetes Secrets.
  !! Change admin.password in values.yaml before deploying to production !!
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  admin-user:     {{ .Values.admin.user     | b64enc | quote }}
  admin-password: {{ .Values.admin.password | b64enc | quote }}
