# -----------------------------------------------------------------
# Prometheus Helm Chart — values.yaml
# -----------------------------------------------------------------

namespace: monitoring

image:
  repository: prom/prometheus
  tag: v2.51.2
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

service:
  type: NodePort
  port: 9090
  nodePort: 30090  # Access: http://<node-ip>:30090

# Prometheus data retention
retention: 15d

# Storage for Prometheus TSDB (emptyDir by default — change to PVC for persistence)
storage:
  # Set to true to use a PersistentVolumeClaim instead of emptyDir
  persistent: false
  pvc:
    storageClass: ""   # leave empty to use cluster default
    size: 8Gi
    accessMode: ReadWriteOnce

# Scrape configuration — additional jobs can be added here
scrapeConfig:
  # Scrape interval for all jobs unless overridden
  globalScrapeInterval: 15s
  globalEvaluationInterval: 15s

  # Extra scrape jobs (added to the default prometheus self-scrape job)
  # Example:
  # extraJobs:
  #   - job_name: node-exporter
  #     static_configs:
  #       - targets: ['localhost:9100']
  extraJobs: []

# RBAC — required so Prometheus can scrape Kubernetes endpoints
rbac:
  create: true

serviceAccount:
  create: true
  name: prometheus

# Pod security context
podSecurityContext:
  fsGroup: 65534
  runAsUser: 65534
  runAsNonRoot: true

# Node scheduling
nodeSelector: {}
tolerations: []
affinity: {}
