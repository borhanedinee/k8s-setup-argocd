{{- if .Values.rbac.create }}
{{- /*
  ClusterRole — grants Prometheus read access to Kubernetes API server
  resources so it can scrape node, pod, service, and endpoint metrics.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  # Core API group — pods, nodes, services, endpoints, namespaces
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]

  # Extensions / networking — ingresses
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

  # Non-resource URLs — /metrics endpoint on the API server itself
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
{{- end }}
